name: Verbesserung vorschlagen
description: Eine neue Funktion oder Verbesserung diskutieren
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Danke für deinen Vorschlag. Beschreibe möglichst das Problem, nicht nur eine konkrete Implementierung.
  - type: checkboxes
    id: checks
    attributes:
      label: Vorprüfung
      options:
        - label: Ich habe nach bestehenden Issues und Pull Requests gesucht.
          required: true
        - label: Der Vorschlag benötigt keine Veröffentlichung fremder oder vertraulicher Inhalte.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem oder Anwendungsfall
      description: Welches konkrete Problem soll gelöst werden und für wen?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Gewünschtes Ergebnis
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Erwogene Alternativen
  - type: textarea
    id: security
    attributes:
      label: Sicherheits- und Datenschutzfolgen
      description: Betrifft der Vorschlag Login, Netzwerk, Downloads, IPC, Dateien oder Nutzerdaten?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Zusätzlicher Kontext
