name: Suggest an improvement
description: Discuss a new feature or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Describe the problem you want to solve, not only a specific implementation.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This proposal does not require publishing third-party or confidential material.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What specific problem should be solved, and for whom?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Does the proposal affect sign-in, networking, downloads, IPC, files, or user data?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
