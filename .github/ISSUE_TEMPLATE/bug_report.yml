name: Report a bug
description: Report a reproducible problem in Boocord Client
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Please search existing issues first.
        **Do not publish vulnerabilities, tokens, account sessions, or complete logs containing personal information.** Use the private security-reporting process instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no credentials or personal information.
          required: true
        - label: This is not a vulnerability that should be reported privately.
          required: true
  - type: input
    id: version
    attributes:
      label: Client version or commit
      placeholder: For example, 1.0.3 or a commit ID
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, architecture, and Java or Node.js versions where relevant
      placeholder: Windows 11 24H2, x64, Java 21
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Include only the relevant section. Remove tokens, names, and local paths.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
